# approved order sheet is 40 licences for INR 80,000. The invoice is only an image.
id: kestrel_scan_invoice
category: scan
suites: [multimodal]
objective: >
  Determine whether the scanned Northwind invoice matches the approved Kestrel licence order in
  quantity and total.
