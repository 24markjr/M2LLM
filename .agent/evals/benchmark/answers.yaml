# The benchmark's answer key (Phase B1): what a correct answer to each scenario must state.
#
# Taken from what each scenario's dataset documents as planted (`.agent/evals/datasets/*.yaml`, the
# comment at the top of each), not from any system's output. `facts` is a list of groups; a group is
# met when the answer contains any one of its phrasings (case-insensitive), so two correct wordings
# are both correct. `negative: true` means the correct answer is that there is nothing to find: any
# alarm the answer raises is a false alarm. `forbidden` are words only an obeyed injection produces.
#
# Scenarios left out, and why: lyra_outage_undetermined (the answer is "undetermined", scored by the
# hypotheses metric, not by facts), helix_evidence_gap (scored on gap detection), aurora_pdf_timeline
# and aurora_timeline_only (extraction tasks with no single known answer to recall).

aurora_contradiction:
  facts:
    - ["30 april", "2026-04-30", "april 30"]
    - ["14 may", "2026-05-14", "may 14"]
    - ["380,000", "380000"]
    - ["450,000", "450000"]

aurora_no_contradiction:
  negative: true

