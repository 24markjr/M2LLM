# JARVIS on-premise (v4 Phase 10): everything in the customer's network, the model included, no
# outside connection needed. Installed from a bundle by install.sh; the images are loaded locally.
#
#   docker compose -f docker-compose.onprem.yml --env-file .env up -d
#   (with an NVIDIA GPU: add -f docker-compose.gpu.yml)

name: jarvis

services:
  web:
    image: jarvis-web:${TAG}
    restart: unless-stopped
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      # No Let's Encrypt inside a closed network: Caddy's own local certificate authority.
      CADDY_GLOBAL_OPTIONS: ${CADDY_GLOBAL_OPTIONS:-local_certs}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy

  backend:
    image: jarvis-backend:${TAG}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://jarvis:${POSTGRES_PASSWORD}@postgres:5432/jarvis
      GRAPH_STORE: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      AUTH_REQUIRED: "true"
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      COOKIE_SECURE: "true"
      CORS_ORIGINS: '["https://${SITE_ADDRESS}"]'
      # Air-gapped: models come from the bundle; nothing is fetched from the internet.
      HF_HOME: /srv/.agent/media-cache/hf
      HF_HUB_OFFLINE: "1"
      MAX_CONCURRENT_RUNS: ${MAX_CONCURRENT_RUNS:-2}
    volumes:
      - agent-runs:/srv/.agent/runs
      - agent-uploads:/srv/.agent/uploads
      - agent-evidence:/srv/.agent/evidence
      - agent-media-cache:/srv/.agent/media-cache
      - agent-traces:/srv/.agent/traces
    depends_on:
      migrate:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_started

  migrate:
    image: jarvis-backend:${TAG}
    restart: "no"
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://jarvis:${POSTGRES_PASSWORD}@postgres:5432/jarvis
    depends_on:
      postgres:
        condition: service_healthy

  ollama:
    image: ollama/ollama:${OLLAMA_TAG:-latest}
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: ${MAX_CONCURRENT_RUNS:-2}
    volumes:
      - ollama-models:/root/.ollama

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: jarvis
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis -d jarvis"]
      interval: 5s
      timeout: 5s
      retries: 20

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

volumes:
  caddy-data:
  caddy-config:
  pgdata:
  neo4j-data:
  ollama-models:
  agent-runs:
  agent-uploads:
  agent-evidence:
  agent-media-cache:
  agent-traces:
